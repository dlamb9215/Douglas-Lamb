name: Settle NBA Prediction Ledger

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: write

concurrency:
  group: nba-prediction-ledger-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NBA dependencies
        run: python -m pip install -r requirements-nba.txt
      - name: Validate ledger and settlement code
        run: python -m unittest -v nba.test_prediction_ledger nba.test_settle_ledger nba.test_backtest
      - name: Settle completed games
        run: python -m nba.settle_ledger --ledger nba/ledger/predictions.csv
      - name: Commit settled results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/ledger/predictions.csv
          if git diff --cached --quiet; then
            echo "No completed forecasts to settle."
          else
            git commit -m "Settle completed NBA prediction ledger rows"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
