name: Doug's Simulator CI

on:
  push:
    branches: ["main", "upgrade/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NBA simulator dependency
        run: python -m pip install --upgrade pip numpy

      - name: Compile all simulator modules
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest -v
