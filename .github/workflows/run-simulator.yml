name: Run Doug's Elite Game Simulator

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "nfl_data.py"
      - "drive_simulator.py"
      - "update_nfl_stats.py"
      - "test_simulator.py"
      - ".github/workflows/run-simulator.yml"
  workflow_dispatch:
    inputs:
      home:
        description: Home team
        required: true
        default: BAL
        type: string
      away:
        description: Away team
        required: true
        default: JAX
        type: string
      trials:
        description: Simulation trials
        required: true
        default: "100000"
        type: string

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Refresh current-season NFL team statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python update_nfl_stats.py

      - name: Validate refreshed 32-team statistics
        run: python nfl_data.py

      - name: Run tests
        run: python -m unittest -v

      - name: Run matchup
        run: python main.py --home "${{ inputs.home || 'BAL' }}" --away "${{ inputs.away || 'JAX' }}" --trials "${{ inputs.trials || '100000' }}" | tee simulation-results.txt

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: matchup-simulation-results
          path: simulation-results.txt
