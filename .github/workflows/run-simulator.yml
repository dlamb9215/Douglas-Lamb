name: Run Doug's Elite Game Simulator

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "nfl_data.py"
      - "drive_simulator.py"
      - "update_nfl_stats.py"
      - "nfl_player_data.py"
      - "refresh_player_data.py"
      - "pregame_context.py"
      - "test_pregame_context.py"
      - "test_nfl_player_data.py"
      - "test_simulator.py"
      - "calibration.py"
      - "test_calibration.py"
      - "test_player_prop_simulator.py"
      - "test_matchup_player_pipeline.py"
      - "player_projections.py"
      - "player_prop_simulator.py"
      - "matchup_player_pipeline.py"
      - "game_day_confirmations.py"
      - "test_nfl_forecast_ledger.py"
      - "test_injury_exposure.py"
      - "test_nfl_weather.py"
      - "nfl_forecast_ledger.py"
      - "injury_exposure.py"
      - "nfl_weather.py"
      - ".github/workflows/run-simulator.yml"
  workflow_dispatch:
    inputs:
      home:
        description: Home team
        required: true
        default: ATL
        type: string
      away:
        description: Away team
        required: true
        default: CIN
        type: string
      trials:
        description: Simulation trials
        required: true
        default: "100000"
        type: string
      spread:
        description: Current sportsbook spread (home-team perspective); leave blank if unavailable
        required: false
        default: ""
        type: string
      total:
        description: Current sportsbook total; leave blank if unavailable
        required: false
        default: ""
        type: string
      home_odds:
        description: Current home moneyline American odds; leave blank if unavailable
        required: false
        default: ""
        type: string
      away_odds:
        description: Current away moneyline American odds; leave blank if unavailable
        required: false
        default: ""
        type: string
      over_odds:
        description: Current over American odds; leave blank if unavailable
        required: false
        default: ""
        type: string
      under_odds:
        description: Current under American odds; leave blank if unavailable
        required: false
        default: ""
        type: string
      neutral_site:
        description: Neutral-site game (disables home-field advantage)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Refresh current-season NFL team statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python update_nfl_stats.py

      - name: Validate refreshed 32-team statistics
        run: python nfl_data.py

      - name: Refresh current-season player, injury, roster and depth-chart data
        run: python refresh_player_data.py --weeks 5 --output player_pool.json

      - name: Fetch matchup kickoff weather
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          HOME_TEAM: ${{ inputs.home || 'ATL' }}
          AWAY_TEAM: ${{ inputs.away || 'CIN' }}
        run: |
          if ! python nfl_weather.py --home "$HOME_TEAM" --away "$AWAY_TEAM" --output nfl-weather.json; then
            python -c 'import json,os; json.dump({"available":False,"home_team":os.environ["HOME_TEAM"],"away_team":os.environ["AWAY_TEAM"],"warning":"Weather lookup unavailable; no adjustment applied."},open("nfl-weather.json","w"),indent=2)'
          fi

      - name: Validate fresh pregame context with weather
        if: github.event_name == 'workflow_dispatch'
        run: python pregame_context.py --home "${{ inputs.home || 'ATL' }}" --away "${{ inputs.away || 'CIN' }}" --input player_pool.json --weather-input nfl-weather.json --output pregame-context.json

      - name: Validate fresh pregame context
        if: github.event_name != 'workflow_dispatch'
        run: python pregame_context.py --home ATL --away CIN --input player_pool.json --output pregame-context.json

      - name: Reconcile prior NFL forecasts and report calibration
        shell: bash
        run: |
          if ! python nfl_forecast_ledger.py --reconcile --summary; then
            echo "Forecast reconciliation unavailable; existing ledger retained."
          fi

      - name: Run tests
        run: python -m unittest -v

      - name: Run matchup
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          ARGS=(--home "${{ inputs.home || 'ATL' }}" --away "${{ inputs.away || 'CIN' }}" --trials "${{ inputs.trials || '100000' }}" --pregame-report pregame-context.json)
          if [[ -n "${{ inputs.spread }}" ]]; then ARGS+=(--spread "${{ inputs.spread }}"); fi
          if [[ -n "${{ inputs.total }}" ]]; then ARGS+=(--total "${{ inputs.total }}"); fi
          if [[ -n "${{ inputs.home_odds }}" ]]; then ARGS+=(--home-odds "${{ inputs.home_odds }}"); fi
          if [[ -n "${{ inputs.away_odds }}" ]]; then ARGS+=(--away-odds "${{ inputs.away_odds }}"); fi
          if [[ -n "${{ inputs.over_odds }}" ]]; then ARGS+=(--over-odds "${{ inputs.over_odds }}"); fi
          if [[ -n "${{ inputs.under_odds }}" ]]; then ARGS+=(--under-odds "${{ inputs.under_odds }}"); fi
          if [[ "${{ inputs.neutral_site }}" == "true" ]]; then ARGS+=(--neutral-site); fi
          python main.py "${ARGS[@]}" | tee simulation-results.txt

      - name: Save results
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: matchup-simulation-results
          path: |
            simulation-results.txt
            pregame-context.json
