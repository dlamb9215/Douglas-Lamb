name: Run Doug's Elite Game Simulator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-simulator.yml"
      - "main.py"
      - "nfl_data.py"
      - "drive_simulator.py"
      - "update_nfl_stats.py"
      - "nfl_player_data.py"
      - "refresh_player_data.py"
      - "pregame_context.py"
      - "test_pregame_context.py"
      - "test_nfl_player_data.py"
      - "test_simulator.py"
      - "calibration.py"
      - "test_calibration.py"
      - "test_player_prop_simulator.py"
      - "test_matchup_player_pipeline.py"
      - "test_game_day_confirmations.py"
      - "player_projections.py"
      - "player_prop_simulator.py"
      - "matchup_player_pipeline.py"
      - "game_day_confirmations.py"
      - "test_nfl_forecast_ledger.py"
      - "test_injury_exposure.py"
      - "test_nfl_weather.py"
      - "nfl_forecast_ledger.py"
      - "injury_exposure.py"
      - "nfl_weather.py"
      - "market_data.py"
      - "betting_engine/**"
      - "test_market_data.py"
  workflow_dispatch:
    inputs:
      home:
        description: Home team abbreviation
        required: true
        default: "DET"
        type: string
      away:
        description: Away team abbreviation
        required: true
        default: "CHI"
        type: string
      trials:
        description: Simulation trials
        required: true
        default: "100000"
        type: string
      game_config_json:
        description: Optional JSON for confirmed QBs and official source URLs, official game-day confirmation payload, player-prop lines, sportsbook lines/prices/source/timestamp, and neutral_site
        required: false
        default: '{"neutral_site":false}'
        type: string
permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pypdf pdfplumber

      - name: Parse matchup configuration
        if: github.event_name == 'workflow_dispatch'
        env:
          GAME_CONFIG_JSON: ${{ inputs.game_config_json }}
        run: |
          python - <<'PY'
          import json, os
          raw = os.environ.get("GAME_CONFIG_JSON", "").strip()
          config = json.loads(raw) if raw else {}
          if not isinstance(config, dict): raise SystemExit("game_config_json must be a JSON object")
          with open("game-config.json", "w", encoding="utf-8") as handle: json.dump(config, handle, indent=2)
          for key, filename in (("game_day_confirmations_json", "game_day_confirmations.json"), ("player_prop_lines_json", "player_prop_lines.json")):
              payload = config.get(key)
              if payload is not None:
                  if not isinstance(payload, dict): raise SystemExit(f"{key} must be a JSON object")
                  with open(filename, "w", encoding="utf-8") as handle: json.dump(payload, handle, indent=2)
          PY

      - name: Refresh current-season NFL team statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python update_nfl_stats.py

      - name: Validate refreshed 32-team statistics
        run: python nfl_data.py

      - name: Refresh current-season player, injury, roster and depth-chart data
        run: python refresh_player_data.py --weeks 5 --output player_pool.json

      - name: Fetch matchup kickoff weather
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          HOME_TEAM: ${{ inputs.home || 'DET' }}
          AWAY_TEAM: ${{ inputs.away || 'CHI' }}
        run: |
          NEUTRAL_SITE="$(jq -r '.neutral_site // false' game-config.json)"
          if [[ "$NEUTRAL_SITE" == "true" ]]; then
            python -c 'import json,os; json.dump({"available":False,"neutral_site":True,"home_team":os.environ["HOME_TEAM"],"away_team":os.environ["AWAY_TEAM"],"warning":"Neutral-site game; no outdoor weather adjustment applied."},open("nfl-weather.json","w"),indent=2)'
          elif ! python nfl_weather.py --home "$HOME_TEAM" --away "$AWAY_TEAM" --output nfl-weather.json; then
            python -c 'import json,os; json.dump({"available":False,"home_team":os.environ["HOME_TEAM"],"away_team":os.environ["AWAY_TEAM"],"warning":"Weather lookup unavailable; no adjustment applied."},open("nfl-weather.json","w"),indent=2)'
          fi

      - name: Validate fresh pregame context with weather
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          HOME_QB="$(jq -r '.home_qb_confirmed // empty' game-config.json)"
          AWAY_QB="$(jq -r '.away_qb_confirmed // empty' game-config.json)"
          HOME_SOURCE="$(jq -r '.home_qb_source // empty' game-config.json)"
          AWAY_SOURCE="$(jq -r '.away_qb_source // empty' game-config.json)"
          python pregame_context.py --home "${{ inputs.home || 'DET' }}" --away "${{ inputs.away || 'CHI' }}" --input player_pool.json --weather-input nfl-weather.json --home-qb-confirmed "$HOME_QB" --away-qb-confirmed "$AWAY_QB" --home-qb-source "$HOME_SOURCE" --away-qb-source "$AWAY_SOURCE" --output pregame-context.json

      - name: Validate fresh pregame context
        if: github.event_name != 'workflow_dispatch'
        run: python pregame_context.py --home NYG --away JAX --input player_pool.json --output pregame-context.json

      - name: Reconcile prior NFL forecasts and report calibration
        shell: bash
        run: |
          if ! python nfl_forecast_ledger.py --reconcile --summary; then
            echo "Forecast reconciliation unavailable; existing ledger retained."
          fi

      - name: Run tests
        run: python -m unittest -v

      - name: Prepare official game-day confirmation input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ ! -f game_day_confirmations.json ]]; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          payload = {
              "source": "No official confirmation file supplied; placeholder only",
              "source_url": "",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "all_inactives_reviewed": False,
              "players": [],
          }
          with open("game_day_confirmations.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
          PY
          fi

      - name: Run matchup
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          ARGS=(--home "${{ inputs.home || 'DET' }}" --away "${{ inputs.away || 'CHI' }}" --trials "${{ inputs.trials || '100000' }}" --pregame-report pregame-context.json --game-day-confirmations game_day_confirmations.json)
          SPREAD="$(jq -r '.spread // empty' game-config.json)"
          TOTAL="$(jq -r '.total // empty' game-config.json)"
          HOME_ODDS="$(jq -r '.home_odds // empty' game-config.json)"
          AWAY_ODDS="$(jq -r '.away_odds // empty' game-config.json)"
          HOME_SPREAD_ODDS="$(jq -r '.home_spread_odds // empty' game-config.json)"
          AWAY_SPREAD_ODDS="$(jq -r '.away_spread_odds // empty' game-config.json)"
          OVER_ODDS="$(jq -r '.over_odds // empty' game-config.json)"
          UNDER_ODDS="$(jq -r '.under_odds // empty' game-config.json)"
          ODDS_SOURCE="$(jq -r '.odds_source // empty' game-config.json)"
          ODDS_CHECKED_AT="$(jq -r '.odds_checked_at // empty' game-config.json)"
          HAS_MARKET_LINES=false
          for value in "$SPREAD" "$TOTAL" "$HOME_ODDS" "$AWAY_ODDS" "$HOME_SPREAD_ODDS" "$AWAY_SPREAD_ODDS" "$OVER_ODDS" "$UNDER_ODDS"; do
            if [[ -n "$value" ]]; then HAS_MARKET_LINES=true; fi
          done
          if [[ "$HAS_MARKET_LINES" == "true" && ( -z "$ODDS_SOURCE" || -z "$ODDS_CHECKED_AT" ) ]]; then
            echo "WARNING: Market lines entered without sportsbook source and timezone-aware checked-at timestamp. Ignoring all market lines."
            echo "Market lines ignored: missing sportsbook source and/or timestamp." > market-data-warning.txt
          else
            [[ -n "$SPREAD" ]] && ARGS+=(--spread "$SPREAD")
            [[ -n "$TOTAL" ]] && ARGS+=(--total "$TOTAL")
            [[ -n "$HOME_ODDS" ]] && ARGS+=(--home-odds "$HOME_ODDS")
            [[ -n "$HOME_SPREAD_ODDS" ]] && ARGS+=(--home-spread-odds "$HOME_SPREAD_ODDS")
            [[ -n "$AWAY_SPREAD_ODDS" ]] && ARGS+=(--away-spread-odds "$AWAY_SPREAD_ODDS")
            [[ -n "$AWAY_ODDS" ]] && ARGS+=(--away-odds "$AWAY_ODDS")
            [[ -n "$OVER_ODDS" ]] && ARGS+=(--over-odds "$OVER_ODDS")
            [[ -n "$UNDER_ODDS" ]] && ARGS+=(--under-odds "$UNDER_ODDS")
            [[ -n "$ODDS_SOURCE" ]] && ARGS+=(--odds-source "$ODDS_SOURCE")
            [[ -n "$ODDS_CHECKED_AT" ]] && ARGS+=(--odds-checked-at "$ODDS_CHECKED_AT")
          fi
          if [[ "$(jq -r '.neutral_site // false' game-config.json)" == "true" ]]; then ARGS+=(--neutral-site); fi
          python main.py "${ARGS[@]}" | tee simulation-results.txt
      - name: Run confirmed-starter player prop projections
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          HOME_TEAM: ${{ inputs.home || 'DET' }}
          AWAY_TEAM: ${{ inputs.away || 'CHI' }}
        run: |
          if [[ ! -f game_day_confirmations.json ]]; then
            python -c 'import json,os,datetime; json.dump({"source":"No official confirmation file supplied; placeholder only","checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"players":[]},open("game_day_confirmations.json","w"),indent=2)'
          fi
          ARGS=(--home "$HOME_TEAM" --away "$AWAY_TEAM" --pool player_pool.json --confirmations game_day_confirmations.json --trials "${{ inputs.trials || '100000' }}" --output matchup-player-report.json)
          if [[ -f player_prop_lines.json ]]; then ARGS+=(--lines player_prop_lines.json); fi
          if ! python matchup_player_pipeline.py "${ARGS[@]}" > player-prop-status.txt 2>&1; then
            echo "PLAYER PROPS BLOCKED: confirmation file is stale, invalid, or missing required data." >> player-prop-status.txt
          fi

      - name: Write readable run summary
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          {
            echo "# Doug's Elite Game Simulator"
            echo ""
            echo "- Matchup: ${{ inputs.away || 'CHI' }} at ${{ inputs.home || 'DET' }}"
            echo "- Trials requested: ${{ inputs.trials || '100000' }}"
            echo "- Workflow run: ${{ github.run_id }}"
            echo ""
            echo "## Pregame gates"
            if [[ -f pregame-context.json ]]; then
              python - <<'PY'
          import json
          d=json.load(open("pregame-context.json", encoding="utf-8"))
          print(f"- Player data source: {d.get('source', 'unknown')}")
          print(f"- Team simulation context available: {d.get('team_simulation_ready', False)}")
          print("- Official game-day inactives/starters: NOT CONFIRMED by feed")
          for item in d.get("betting_readiness_blockers", []):
              print(f"- Betting gate: {item}")
          PY
            else
              echo "- Pregame context report was not created."
            fi
            echo ""
            if [[ -f market-data-warning.txt ]]; then cat market-data-warning.txt; echo ""; fi
            echo "## Simulation output"
            if [[ -f simulation-results.txt ]]; then
              cat simulation-results.txt
            else
              echo "No simulation-results.txt was created; inspect failed workflow steps."
            fi
            echo ""
            echo "## Player-prop status"
            if [[ -f player-prop-status.txt ]]; then
              cat player-prop-status.txt
            else
              echo "Player-prop pipeline did not create a status report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save results
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: matchup-simulation-results
          if-no-files-found: warn
          path: |
            simulation-results.txt
            pregame-context.json
            nfl-weather.json
            matchup-player-report.json
            player-prop-status.txt
            nfl_forecast_ledger.csv
            market-data-warning.txt

      - name: Persist NFL forecast ledger
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -f nfl_forecast_ledger.csv ]] && [[ -n "$(git status --porcelain -- nfl_forecast_ledger.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nfl_forecast_ledger.csv
            git commit -m "Record NFL matchup forecast"
            git push
          fi
