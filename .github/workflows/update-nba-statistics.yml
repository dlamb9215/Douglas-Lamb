name: Update NBA Statistics

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: NBA season label
        required: true
        default: "2026-27"
      prior_season:
        description: Prior NBA season label
        required: true
        default: "2025-26"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and validate all NBA team data
        env:
          NBA_SEASON: ${{ inputs.season || '2026-27' }}
          NBA_PRIOR_SEASON: ${{ inputs.prior_season || '2025-26' }}
        run: python -m nba.update_stats
      - name: Commit refreshed team statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/team_stats.json
          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
          else
            git commit -m "Refresh NBA team statistics"
            git push
          fi
