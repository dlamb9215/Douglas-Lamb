name: Update NFL Statistics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-nfl-stats.yml"
  schedule:
    - cron: "0 12 * * 2"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import NFL statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python update_nfl_stats.py

      - name: Validate team statistics
        run: python nfl_data.py

      - name: Archive immutable weekly statistics snapshot
        run: python snapshot_nfl_stats.py

      - name: Save updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_team_stats.json data_snapshots/
          git diff --cached --quiet || git commit -m "Update NFL team statistics"
          git push
