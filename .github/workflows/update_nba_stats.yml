name: Update NBA Statistics
on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NBA dependencies
        run: python -m pip install -r requirements-nba.txt
      - name: Refresh NBA team statistics
        env:
          DUNKAPI_API_KEY: ${{ secrets.DUNKAPI_API_KEY }}
          NBA_SEASON: "2027"
          NBA_PRIOR_SEASON: "2026"
        run: python nba/update_stats.py
      - name: Validate data and engine
        run: |
          python -m unittest -v nba.test_simulator nba.test_backtest
          python -c "import json; d=json.load(open('nba/team_stats.json')); assert len(d['teams']) == 30"
      - name: Commit refreshed stats
        run: |
          git add -f nba/team_stats.json
          if git diff --cached --quiet -- nba/team_stats.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NBA team statistics"
          git push
