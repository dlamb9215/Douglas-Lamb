name: Run Doug's Elite NHL Simulator

on:
  push:
    paths:
      - 'nhl/**'
      - '.github/workflows/run_nhl_elite.yml'
  workflow_dispatch:
    inputs:
      home:
        description: Home team
        required: true
        type: choice
        options: [ANA, BOS, BUF, CAR, CBJ, CGY, CHI, COL, DAL, DET, EDM, FLA, LAK, MIN, MTL, NJD, NSH, NYI, NYR, OTT, PHI, PIT, SEA, SJS, STL, TBL, TOR, UTA, VAN, VGK, WPG, WSH]
        default: BOS
      away:
        description: Away team
        required: true
        type: choice
        options: [ANA, BOS, BUF, CAR, CBJ, CGY, CHI, COL, DAL, DET, EDM, FLA, LAK, MIN, MTL, NJD, NSH, NYI, NYR, OTT, PHI, PIT, SEA, SJS, STL, TBL, TOR, UTA, VAN, VGK, WPG, WSH]
        default: FLA
      trials:
        description: Monte Carlo trials
        required: true
        type: choice
        options: ["100000", "250000", "500000", "1000000", "5000000"]
        default: "100000"
      total:
        description: Game total goals line
        required: true
        default: "6.0"
        type: string
      seed:
        description: Reproducible seed
        required: true
        default: "20261115"
        type: string
      home_goalie_id:
        description: Optional confirmed home goalie NHL player ID
        required: false
        default: ""
        type: string
      away_goalie_id:
        description: Optional confirmed away goalie NHL player ID
        required: false
        default: ""
        type: string
      home_ml:
        description: Home moneyline odds (American; 0 skips comparison)
        required: true
        default: "0"
        type: string
      away_ml:
        description: Away moneyline odds (American; 0 skips comparison)
        required: true
        default: "0"
        type: string
      over_odds:
        description: Over odds (American; 0 skips comparison)
        required: true
        default: "0"
        type: string
      under_odds:
        description: Under odds (American; 0 skips comparison)
        required: true
        default: "0"
        type: string
      home_puck_odds:
        description: Home -1.5 odds (American; 0 skips comparison)
        required: true
        default: "0"
        type: string
      away_puck_odds:
        description: Away +1.5 odds (American; 0 skips comparison)
        required: true
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline unit tests
        run: python -m unittest -v nhl.test_elite
      - name: Run NHL matchup model
        env:
          HOME_GOALIE_ID: ${{ inputs.home_goalie_id }}
          AWAY_GOALIE_ID: ${{ inputs.away_goalie_id }}
        run: |
          ARGS=""
          if [ -n "$HOME_GOALIE_ID" ]; then ARGS="$ARGS --home-goalie-id $HOME_GOALIE_ID"; fi
          if [ -n "$AWAY_GOALIE_ID" ]; then ARGS="$ARGS --away-goalie-id $AWAY_GOALIE_ID"; fi
          python -m nhl.elite --home "${{ inputs.home }}" --away "${{ inputs.away }}" --trials "${{ inputs.trials }}" --total "${{ inputs.total }}" --seed "${{ inputs.seed }}" --home-ml "${{ inputs.home_ml }}" --away-ml "${{ inputs.away_ml }}" --over-odds "${{ inputs.over_odds }}" --under-odds "${{ inputs.under_odds }}" --home-puck-odds "${{ inputs.home_puck_odds }}" --away-puck-odds "${{ inputs.away_puck_odds }}" $ARGS | tee nhl-elite-results.txt
      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: dougs-elite-nhl-results
          path: |
            nhl-elite-results.txt
            nhl-elite-results.json
          if-no-files-found: error
