name: Doug's Simulator Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NBA dependency
        run: python -m pip install --upgrade pip numpy
      - name: Run NFL simulator tests
        run: python -m unittest -v test_simulator
      - name: Run NBA simulator tests
        run: python -m unittest -v nba.test_simulator
