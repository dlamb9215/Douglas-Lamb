name: Doug's Simulator Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NBA dependency
        run: python -m pip install --upgrade pip -r requirements-nba.txt
      - name: Compile all simulator modules
        run: python -m compileall -q .
      - name: Run NFL simulator tests
        run: python -m unittest -v test_simulator test_pregame_context test_nfl_player_data test_player_availability test_player_prop_simulator test_matchup_player_pipeline test_nfl_weather test_injury_exposure test_nfl_forecast_ledger test_calibration test_market_data
      - name: Run NBA simulator and backtest tests
        run: python -m unittest -v nba.test_simulator nba.test_backtest nba.test_data_quality nba.test_schedule nba.test_odds nba.test_injuries
      - name: Run NCAA simulator and data pipeline tests
        run: python -m unittest discover -s ncaa/tests -v
