name: Refresh NCAA FBS Statistics

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year
        required: true
        default: "2026"
        type: string
      classification:
        description: NCAA division
        required: true
        default: fbs
        type: choice
        options:
          - fbs
          - fcs
      season_type:
        description: Season segment
        required: true
        default: regular
        type: choice
        options:
          - regular
          - postseason
          - both
  schedule:
    - cron: "20 10 * * 2,3,4,5,6,0"

permissions:
  contents: write

concurrency:
  group: ncaa-forecast-ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh verified FBS data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          YEAR="${{ inputs.year }}"
          TYPE="${{ inputs.season_type }}"
          if [[ -z "$YEAR" ]]; then YEAR="$(date -u +%Y)"; fi
          if [[ -z "$TYPE" ]]; then TYPE="regular"; fi
          python -m ncaa.data.refresh --year "$YEAR" --season-type "$TYPE"
      - name: Refresh player season statistics and usage (optional)
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          YEAR="${{ inputs.year }}"
          TYPE="${{ inputs.season_type }}"
          if [[ -z "$YEAR" ]]; then YEAR="$(date -u +%Y)"; fi
          if [[ -z "$TYPE" ]]; then TYPE="regular"; fi
          python -m ncaa.data.player_refresh --year "$YEAR" --season-type "$TYPE"
      - name: Reconcile completed games against forecast ledger (optional)
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          YEAR="${{ inputs.year }}"
          if [[ -z "$YEAR" ]]; then YEAR="$(date -u +%Y)"; fi
          python -m ncaa.reconcile --year "$YEAR" --input ncaa/forecast_ledger.csv
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ncaa/data/team_profiles.csv ncaa/data/team_rankings.json
          if [[ -f ncaa/data/team_profiles_fcs.csv ]]; then git add ncaa/data/team_profiles_fcs.csv; fi
          if [[ -f ncaa/data/team_rankings_fcs.json ]]; then git add ncaa/data/team_rankings_fcs.json; fi
          if [[ -f ncaa/data/player_season_data.json ]]; then git add ncaa/data/player_season_data.json; fi
          if [[ -f ncaa/data/player_data_status.json ]]; then git add ncaa/data/player_data_status.json; fi
          if [[ -f ncaa/forecast_ledger.csv ]]; then git add ncaa/forecast_ledger.csv; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh NCAA FBS team statistics"
            git push
          fi
