name: Doug's Elite NCAA Football Simulator

permissions:
  contents: write

concurrency:
  group: ncaa-forecast-ledger
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      season_year:
        description: Season year
        required: true
        default: "2026"
        type: string
      classification:
        description: NCAA division
        required: true
        default: fbs
        type: choice
        options:
          - fbs
          - fcs
      season_type:
        description: Season segment
        required: true
        default: regular
        type: choice
        options:
          - regular
          - postseason
          - both
      home:
        description: Home college team
        required: true
        default: Minnesota
        type: string
      away:
        description: Away college team
        required: true
        default: UCLA
        type: string
      trials:
        description: Monte Carlo trials
        required: true
        default: "500000"
        type: string
      home_spread:
        description: Home-team sportsbook handicap
        required: false
        type: string
      total:
        description: Sportsbook game total
        required: false
        type: string
      neutral_site:
        description: Neutral-site game
        required: true
        default: false
        type: boolean
      home_ml_odds:
        description: Home moneyline American odds (optional)
        required: false
        type: string
      away_ml_odds:
        description: Away moneyline American odds (optional)
        required: false
        type: string
      over_odds:
        description: Over American odds (optional)
        required: false
        type: string
      under_odds:
        description: Under American odds (optional)
        required: false
        type: string
      require_verified_pregame:
        description: Block unless all sourced pregame checks are verified
        required: true
        default: false
        type: boolean
      pregame_checks:
        description: Optional JSON string with sourced QB, injury, weather and market checks
        required: false
        type: string
      player_inputs:
        description: Optional JSON list of current sourced player usage inputs
        required: false
        type: string
      kickoff:
        description: Scheduled kickoff ISO-8601 timestamp with timezone (needed for verified pregame ledger)
        required: false
        default: "2026-11-07T12:00:00-05:00"
        type: string

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh current-season NCAA team statistics
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON_YEAR: ${{ inputs.season_year }}
          SEASON_TYPE: ${{ inputs.season_type }}
          CLASSIFICATION: ${{ inputs.classification }}
        run: python -m ncaa.data.refresh --year "$SEASON_YEAR" --season-type "$SEASON_TYPE" --classification "$CLASSIFICATION"
      - name: Fetch venue weather context for kickoff (optional)
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          HOME_TEAM: ${{ inputs.home }}
          AWAY_TEAM: ${{ inputs.away }}
          GAME_KICKOFF: ${{ inputs.kickoff }}
          SEASON_YEAR: ${{ inputs.season_year }}
          SEASON_TYPE: ${{ inputs.season_type }}
          CLASSIFICATION: ${{ inputs.classification }}
        run: |
          args=(--year "$SEASON_YEAR" --season-type "$SEASON_TYPE" --classification "$CLASSIFICATION" --home "$HOME_TEAM" --away "$AWAY_TEAM" --output weather.json)
          if [[ -n "$GAME_KICKOFF" ]]; then args+=(--kickoff "$GAME_KICKOFF"); fi
          python -m ncaa.weather "${args[@]}"
      - name: Refresh player season statistics and usage (optional provider entitlement)
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON_YEAR: ${{ inputs.season_year }}
          SEASON_TYPE: ${{ inputs.season_type }}
          CLASSIFICATION: ${{ inputs.classification }}
        run: python -m ncaa.data.player_refresh --year "$SEASON_YEAR" --season-type "$SEASON_TYPE" --classification "$CLASSIFICATION"
      - name: Reconcile previous forecast ledger with completed scores (optional)
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON_YEAR: ${{ inputs.season_year }}
        run: python -m ncaa.reconcile --year "$SEASON_YEAR" --input ncaa/forecast_ledger.csv
      - name: Build player projection inputs from CFBD season stats (optional)
        continue-on-error: true
        env:
          HOME_TEAM: ${{ inputs.home }}
          AWAY_TEAM: ${{ inputs.away }}
          CLASSIFICATION: ${{ inputs.classification }}
        run: |
          if [[ "$CLASSIFICATION" == "fcs" ]]; then profile_file="ncaa/data/team_profiles_fcs.csv"; else profile_file="ncaa/data/team_profiles.csv"; fi
          python -m ncaa.data.build_player_inputs --team-profiles "$profile_file" --classification "$CLASSIFICATION" --teams "$HOME_TEAM" "$AWAY_TEAM" --output player-inputs.json
      - name: Run NCAA simulator tests
        run: python -m unittest discover -s ncaa/tests -v
      - name: Write optional pregame and player inputs
        env:
          PREGAME_CHECKS_JSON: ${{ inputs.pregame_checks }}
          PLAYER_INPUTS_JSON: ${{ inputs.player_inputs }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          if os.environ.get("PREGAME_CHECKS_JSON", "").strip():
              Path("pregame-checks.json").write_text(os.environ["PREGAME_CHECKS_JSON"], encoding="utf-8")
          if os.environ.get("PLAYER_INPUTS_JSON", "").strip():
              Path("player-inputs.json").write_text(os.environ["PLAYER_INPUTS_JSON"], encoding="utf-8")
          PY
      - name: Run NCAA matchup
        env:
          HOME_ML_ODDS: ${{ inputs.home_ml_odds }}
          AWAY_ML_ODDS: ${{ inputs.away_ml_odds }}
          OVER_ODDS: ${{ inputs.over_odds }}
          UNDER_ODDS: ${{ inputs.under_odds }}
          REQUIRE_PREGAME: ${{ inputs.require_verified_pregame }}
          HOME_TEAM: ${{ inputs.home }}
          AWAY_TEAM: ${{ inputs.away }}
          TRIALS: ${{ inputs.trials }}
          SEASON_YEAR: ${{ inputs.season_year }}
          CLASSIFICATION: ${{ inputs.classification }}
          HOME_SPREAD: ${{ inputs.home_spread }}
          TOTAL_LINE: ${{ inputs.total }}
          NEUTRAL_SITE: ${{ inputs.neutral_site }}
          GAME_KICKOFF: ${{ inputs.kickoff }}
        shell: bash
        run: |
          args=(--home "$HOME_TEAM" --away "$AWAY_TEAM" --trials "$TRIALS" --season "$SEASON_YEAR" --classification "$CLASSIFICATION")
          if [[ -n "$HOME_SPREAD" ]]; then args+=(--home-spread "$HOME_SPREAD"); fi
          if [[ -n "$TOTAL_LINE" ]]; then args+=(--total "$TOTAL_LINE"); fi
          if [[ "$NEUTRAL_SITE" == "true" ]]; then args+=(--neutral-site); fi
          for pair in "HOME_ML_ODDS:--home-ml-odds" "AWAY_ML_ODDS:--away-ml-odds" "OVER_ODDS:--over-odds" "UNDER_ODDS:--under-odds"; do
            key="${pair%%:*}"; flag="${pair#*:}"
            value="${!key}"
            if [[ -n "$value" ]]; then args+=("$flag" "$value"); fi
          done
          if [[ -f pregame-checks.json ]]; then args+=(--pregame-checks pregame-checks.json); fi
          if [[ "$REQUIRE_PREGAME" == "true" ]]; then args+=(--require-verified-pregame); fi
          if [[ -f player-inputs.json ]]; then args+=(--players player-inputs.json); fi
          if [[ -n "$GAME_KICKOFF" ]]; then args+=(--kickoff "$GAME_KICKOFF"); fi
          if [[ -f weather.json ]]; then args+=(--weather-json weather.json); fi
          python -m ncaa.cli "${args[@]}" --ledger ncaa/forecast_ledger.csv --output ncaa-results.json | tee ncaa-simulation-results.txt
      - name: Commit timestamped forecast ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ncaa/forecast_ledger.csv
          if git diff --cached --quiet; then
            echo "No forecast ledger changes."
          else
            git commit -m "Record NCAA pregame forecast"
            git push
          fi
      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: dougs-elite-ncaa-results
          path: |
            ncaa-results.json
            ncaa-simulation-results.txt
            ncaa/data/team_rankings.json
            ncaa/data/team_profiles.csv
            ncaa/data/team_rankings_fcs.json
            ncaa/data/team_profiles_fcs.csv
            ncaa/data/player_season_data.json
            ncaa/data/player_data_status.json
            pregame-checks.json
            player-inputs.json
            weather.json
