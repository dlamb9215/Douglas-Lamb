name: Run Doug's Elite NBA Simulator
on:
  workflow_dispatch:
    inputs:
      home:
        description: Home team abbreviation
        required: true
        default: "PHX"
        type: string
      away:
        description: Away team abbreviation
        required: true
        default: "LAC"
        type: string
      spread:
        description: Home spread, e.g. -3.5; blank to skip
        required: false
        default: ""
        type: string
      total:
        description: Game total; blank to skip
        required: false
        default: ""
        type: string
      home_ml_odds:
        description: Home moneyline American odds (optional)
        required: false
        default: ""
        type: string
      away_ml_odds:
        description: Away moneyline American odds (optional)
        required: false
        default: ""
        type: string
      spread_odds:
        description: American odds for spread sides
        required: true
        default: "-110"
        type: string
      total_odds:
        description: American odds for total sides
        required: true
        default: "-110"
        type: string
      trials:
        description: Baseline Monte Carlo trials before automatic close-game refinement
        required: true
        default: "1000000"
        type: string
      max_trials:
        description: Maximum trials when the matchup is close; set equal to trials to disable refinement
        required: true
        default: "5000000"
        type: string
      prop_trials:
        description: Monte Carlo trials per eligible player projection
        required: true
        default: "50000"
        type: string
      home_rest:
        description: Home team days of rest before this game
        required: true
        default: "1"
        type: string
      away_rest:
        description: Away team days of rest before this game
        required: true
        default: "0"
        type: string
      home_travel:
        description: Home team travel miles since previous game (0 if unknown)
        required: true
        default: "0"
        type: string
      away_travel:
        description: Away team travel miles since previous game (0 if unknown)
        required: true
        default: "0"
        type: string
      confirmed_lineups_json:
        description: Optional JSON string with confirmed team lineups, availability and projected minutes; props are withheld if absent
        required: false
        default: ""
        type: string
      player_prop_lines_json:
        description: Optional JSON with player stat lines and ESPN BET over_odds/under_odds, keyed by lowercase player name
        required: false
        default: ""
        type: string
      player_props:
        description: Generate experimental player points/rebounds/assists/PRA projections and rank top two per team
        required: true
        default: true
        type: boolean
      auto_injuries:
        description: Fetch official NBA injury report PDF (requires game_date)
        required: true
        default: true
        type: boolean
      espn_bet_odds:
        description: Compare model against ESPN BET current and opening lines (provider 68)
        required: true
        default: true
        type: boolean
      auto_odds:
        description: Optional consensus odds from The Odds API (requires ODDS_API_KEY secret; do not enable with ESPN BET)
        required: true
        default: false
        type: boolean
      game_date:
        description: Optional matchup date YYYY-MM-DD; blank uses today's NBA date in America/New_York
        required: false
        default: ""
        type: string
      home_injury_points:
        description: Manual home team points adjustment for unavailable players
        required: true
        default: "0"
        type: string
      away_injury_points:
        description: Manual away team points adjustment for unavailable players
        required: true
        default: "0"
        type: string
      seed:
        description: Reproducible random seed
        required: true
        default: "42"
        type: string
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-nba.txt
      - name: Run NBA tests
        run: python -m unittest -v nba.test_simulator nba.test_backtest nba.test_data_quality nba.test_schedule nba.test_odds nba.test_espn_odds nba.test_injuries nba.test_player_props nba.test_player_props_backtest
      - name: Require refreshed NBA data
        run: |
          test -s nba/team_stats.json
          python -m nba.data_quality --data nba/team_stats.json --max-age-hours 72
      - name: Run matchup
        env:
          HOME_TEAM: ${{ inputs.home }}
          AWAY_TEAM: ${{ inputs.away }}
          SPREAD: ${{ inputs.spread }}
          TOTAL: ${{ inputs.total }}
          HOME_ML_ODDS: ${{ inputs.home_ml_odds }}
          AWAY_ML_ODDS: ${{ inputs.away_ml_odds }}
          SPREAD_ODDS: ${{ inputs.spread_odds }}
          TOTAL_ODDS: ${{ inputs.total_odds }}
          TRIALS: ${{ inputs.trials }}
          MAX_TRIALS: ${{ inputs.max_trials }}
          SEED: ${{ inputs.seed }}
          HOME_REST: ${{ inputs.home_rest }}
          AWAY_REST: ${{ inputs.away_rest }}
          HOME_TRAVEL: ${{ inputs.home_travel }}
          AWAY_TRAVEL: ${{ inputs.away_travel }}
          GAME_DATE: ${{ inputs.game_date }}
          AUTO_INJURIES: ${{ inputs.auto_injuries }}
          AUTO_ODDS: ${{ inputs.auto_odds }}
          ESPN_BET_ODDS: ${{ inputs.espn_bet_odds }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          HOME_INJURY: ${{ inputs.home_injury_points }}
          AWAY_INJURY: ${{ inputs.away_injury_points }}
        run: |
          set -o pipefail
          if [ -z "$GAME_DATE" ]; then GAME_DATE="$(TZ=America/New_York date +%F)"; fi
          echo "NBA matchup date: $GAME_DATE (America/New_York)"
          args=(--home "$HOME_TEAM" --away "$AWAY_TEAM" --trials "$TRIALS" --max-trials "$MAX_TRIALS" --seed "$SEED" --home-rest "$HOME_REST" --away-rest "$AWAY_REST" --home-travel "$HOME_TRAVEL" --away-travel "$AWAY_TRAVEL" --home-injury-points "$HOME_INJURY" --away-injury-points "$AWAY_INJURY" --spread-odds "$SPREAD_ODDS" --total-odds "$TOTAL_ODDS" --json-output nba-simulation-results.json)
          if [ -n "$HOME_ML_ODDS" ] && [ -n "$AWAY_ML_ODDS" ]; then args+=(--home-ml-odds "$HOME_ML_ODDS" --away-ml-odds "$AWAY_ML_ODDS"); fi
          if [ -n "$SPREAD" ]; then args+=(--spread "$SPREAD"); fi
          if [ -n "$TOTAL" ]; then args+=(--total "$TOTAL"); fi
          args+=(--game-date "$GAME_DATE")
          if [ "$AUTO_INJURIES" = "true" ]; then args+=(--auto-injuries); fi
          if [ "$AUTO_ODDS" = "true" ]; then args+=(--auto-odds); fi
          if [ "$ESPN_BET_ODDS" = "true" ]; then args+=(--espn-bet-odds); fi
          python -m nba.simulator "${args[@]}" | tee nba-simulation-results.txt
      - name: Run experimental player prop projections
        if: ${{ inputs.player_props }}
        env:
          HOME_TEAM: ${{ inputs.home }}
          AWAY_TEAM: ${{ inputs.away }}
          GAME_DATE: ${{ inputs.game_date }}
          PROP_TRIALS: ${{ inputs.prop_trials }}
          LINEUPS_JSON: ${{ inputs.confirmed_lineups_json }}
          PROP_LINES_JSON: ${{ inputs.player_prop_lines_json }}
        run: |
          if [ -z "$GAME_DATE" ]; then GAME_DATE="$(TZ=America/New_York date +%F)"; fi
          echo "Player-prop matchup date: $GAME_DATE (America/New_York)"
          args=(--home "$HOME_TEAM" --away "$AWAY_TEAM" --date "$GAME_DATE" --season 2027 --trials "$PROP_TRIALS" --output nba-player-projections.json)
          if [ -n "$LINEUPS_JSON" ]; then
            python -c 'import json,os; json.loads(os.environ["LINEUPS_JSON"]); open("confirmed-lineups.json","w").write(os.environ["LINEUPS_JSON"])'
            args+=(--lineups-json confirmed-lineups.json)
          fi
          if [ -n "$PROP_LINES_JSON" ]; then
            python -c 'import json,os; json.loads(os.environ["PROP_LINES_JSON"]); open("player-prop-lines.json","w").write(os.environ["PROP_LINES_JSON"])'
            args+=(--lines-json player-prop-lines.json)
          fi
          python -m nba.player_props "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-matchup-results
          if-no-files-found: warn
          path: |
            nba-simulation-results.txt
            nba-simulation-results.json
            nba-player-projections.json
