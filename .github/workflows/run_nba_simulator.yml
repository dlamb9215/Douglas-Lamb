name: "Run Doug's Elite NBA Simulator"

permissions:
  contents: write

concurrency:
  group: nba-simulator-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, "integration/**"]
    paths:
      - "nba/**"
      - "!nba/ledger/**"
      - "betting_engine/**"
      - ".github/workflows/run_nba_simulator.yml"
  pull_request:
    paths:
      - "nba/**"
      - "!nba/ledger/**"
      - "betting_engine/**"
      - ".github/workflows/run_nba_simulator.yml"
  workflow_dispatch:
    inputs:
      home:
        description: Home team abbreviation
        required: true
        default: "CHI"
        type: string
      away:
        description: Away team abbreviation
        required: true
        default: "ATL"
        type: string
      spread:
        description: Home spread, e.g. -3.5; blank to skip
        required: false
        default: ""
        type: string
      total:
        description: Game total; blank to skip
        required: false
        default: ""
        type: string
      trials:
        description: Baseline Monte Carlo trials
        required: true
        default: "1000000"
        type: string
      max_trials:
        description: Maximum trials for close matchups
        required: true
        default: "5000000"
        type: string
      game_date:
        description: Matchup date YYYY-MM-DD
        required: false
        default: "2026-11-13"
        type: string
      game_config_json:
        description: Optional JSON object for sportsbook prices, source/timestamp, confirmed lineups, player-prop lines, rest/travel and other settings; see BETTING_ENGINE_UPGRADE.md
        required: false
        default: '{"auto_injuries":true,"auto_odds":true,"player_props":true,"prop_trials":50000,"seed":42}'
        type: string

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-nba.txt PyYAML
      - name: Run NBA and shared betting-engine tests
        run: python -m unittest -v nba.test_simulator nba.test_backtest nba.test_data_quality nba.test_data_hub nba.test_schedule nba.test_odds nba.test_espn_odds nba.test_injuries nba.test_player_props nba.test_player_props_backtest nba.test_prediction_ledger nba.test_settle_ledger betting_engine.test_decision betting_engine.test_integrations
      - name: Require refreshed NBA data
        run: |
          test -s nba/team_stats.json
          python -m nba.data_quality --data nba/team_stats.json --max-age-hours 72
      - name: Build multi-source NBA data readiness report
        if: github.event_name == 'workflow_dispatch'
        env:
          HOME_TEAM: ${{ inputs.home }}
          AWAY_TEAM: ${{ inputs.away }}
          GAME_DATE: ${{ inputs.game_date }}
          GAME_CONFIG_JSON: ${{ inputs.game_config_json }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GAME_DATE" ]; then GAME_DATE="$(TZ=America/New_York date +%F)"; fi
          python - <<'PY'
          import json, os
          raw = os.environ.get("GAME_CONFIG_JSON", "").strip()
          config = json.loads(raw) if raw else {}
          lineup = config.get("confirmed_lineups_json")
          if lineup is not None:
              with open("preflight-lineups.json", "w", encoding="utf-8") as handle:
                  json.dump(lineup, handle)
          PY
          lineup_args=()
          if [ -s preflight-lineups.json ]; then lineup_args+=(--lineups preflight-lineups.json); fi
          python -m nba.data_hub --home "$HOME_TEAM" --away "$AWAY_TEAM" --date "$GAME_DATE" --output nba-data-readiness.json "${lineup_args[@]}" | tee nba-data-readiness.txt
      - name: Run matchup
        id: run_matchup
        if: github.event_name == 'workflow_dispatch'
        env:
          HOME_TEAM: ${{ inputs.home }}
          AWAY_TEAM: ${{ inputs.away }}
          SPREAD: ${{ inputs.spread }}
          TOTAL: ${{ inputs.total }}
          TRIALS: ${{ inputs.trials }}
          MAX_TRIALS: ${{ inputs.max_trials }}
          GAME_DATE: ${{ inputs.game_date }}
          GAME_CONFIG_JSON: ${{ inputs.game_config_json }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          raw = os.environ.get("GAME_CONFIG_JSON", "").strip()
          config = json.loads(raw) if raw else {}
          if not isinstance(config, dict):
              raise SystemExit("game_config_json must be a JSON object")
          with open("nba-game-config.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle, indent=2)
          PY
          CONFIG=nba-game-config.json
          get_config() { jq -r "$1 // empty" "$CONFIG"; }
          if [ -z "$GAME_DATE" ]; then GAME_DATE="$(TZ=America/New_York date +%F)"; fi
          HOME_REST="$(jq -r '.home_rest // 2' "$CONFIG")"
          AWAY_REST="$(jq -r '.away_rest // 2' "$CONFIG")"
          HOME_TRAVEL="$(jq -r '.home_travel // 0' "$CONFIG")"
          AWAY_TRAVEL="$(jq -r '.away_travel // 0' "$CONFIG")"
          HOME_INJURY="$(jq -r '.home_injury_points // 0' "$CONFIG")"
          AWAY_INJURY="$(jq -r '.away_injury_points // 0' "$CONFIG")"
          SEED="$(jq -r '.seed // 42' "$CONFIG")"
          AUTO_INJURIES="$(jq -r '.auto_injuries // true' "$CONFIG")"
          AUTO_ODDS="$(jq -r '.auto_odds // true' "$CONFIG")"
          ESPN_BET_ODDS="$(jq -r '.espn_bet_odds // false' "$CONFIG")"
          if [ "$AUTO_ODDS" = "true" ] && [ "$ESPN_BET_ODDS" = "true" ]; then
            echo "Enable either ESPN BET or The Odds API, not both."
            exit 1
          fi
          args=(--home "$HOME_TEAM" --away "$AWAY_TEAM" --trials "$TRIALS" --max-trials "$MAX_TRIALS" --seed "$SEED" --home-rest "$HOME_REST" --away-rest "$AWAY_REST" --home-travel "$HOME_TRAVEL" --away-travel "$AWAY_TRAVEL" --home-injury-points "$HOME_INJURY" --away-injury-points "$AWAY_INJURY" --game-date "$GAME_DATE" --json-output nba-simulation-results.json)
          if [ -n "$SPREAD" ]; then args+=(--spread "$SPREAD"); fi
          if [ -n "$TOTAL" ]; then args+=(--total "$TOTAL"); fi
          HOME_ML="$(jq -r '.home_ml_odds // empty' "$CONFIG")"
          AWAY_ML="$(jq -r '.away_ml_odds // empty' "$CONFIG")"
          if [ -n "$HOME_ML" ] && [ -n "$AWAY_ML" ]; then args+=(--home-ml-odds "$HOME_ML" --away-ml-odds "$AWAY_ML"); fi
          HOME_SPREAD_ODDS="$(jq -r '.home_spread_odds // empty' "$CONFIG")"
          AWAY_SPREAD_ODDS="$(jq -r '.away_spread_odds // empty' "$CONFIG")"
          COMMON_SPREAD_ODDS="$(jq -r '.spread_odds // empty' "$CONFIG")"
          if [ -n "$HOME_SPREAD_ODDS" ] && [ -n "$AWAY_SPREAD_ODDS" ]; then
            args+=(--home-spread-odds "$HOME_SPREAD_ODDS" --away-spread-odds "$AWAY_SPREAD_ODDS")
          elif [ -n "$COMMON_SPREAD_ODDS" ]; then
            args+=(--spread-odds "$COMMON_SPREAD_ODDS")
          fi
          OVER_ODDS="$(jq -r '.over_odds // empty' "$CONFIG")"
          UNDER_ODDS="$(jq -r '.under_odds // empty' "$CONFIG")"
          COMMON_TOTAL_ODDS="$(jq -r '.total_odds // empty' "$CONFIG")"
          if [ -n "$OVER_ODDS" ] && [ -n "$UNDER_ODDS" ]; then
            args+=(--over-odds "$OVER_ODDS" --under-odds "$UNDER_ODDS")
          elif [ -n "$COMMON_TOTAL_ODDS" ]; then
            args+=(--total-odds "$COMMON_TOTAL_ODDS")
          fi
          ODDS_SOURCE="$(jq -r '.odds_source // empty' "$CONFIG")"
          ODDS_CHECKED_AT="$(jq -r '.odds_checked_at // empty' "$CONFIG")"
          if [ -n "$ODDS_SOURCE" ]; then args+=(--odds-source "$ODDS_SOURCE"); fi
          if [ -n "$ODDS_CHECKED_AT" ]; then args+=(--odds-checked-at "$ODDS_CHECKED_AT"); fi
          if jq -e '.confirmed_lineups_json != null' "$CONFIG" >/dev/null; then
            jq -c '.confirmed_lineups_json' "$CONFIG" > confirmed-lineups.json
            args+=(--lineups-json confirmed-lineups.json)
          fi
          if [ "$AUTO_INJURIES" = "true" ]; then args+=(--auto-injuries); fi
          if [ "$AUTO_ODDS" = "true" ]; then args+=(--auto-odds); fi
          if [ "$ESPN_BET_ODDS" = "true" ]; then args+=(--espn-bet-odds); fi
          python -m nba.simulator "${args[@]}" | tee nba-simulation-results.txt
      - name: Archive pregame forecast to versioned ledger
        if: github.event_name == 'workflow_dispatch' && steps.run_matchup.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m nba.prediction_ledger --payload nba-simulation-results.json --ledger nba/ledger/predictions.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/ledger/predictions.csv
          if git diff --cached --quiet; then
            echo "Forecast already archived; no ledger update."
          else
            git commit -m "Archive NBA pregame forecast run ${GITHUB_RUN_ID}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run experimental player prop projections
        if: github.event_name == 'workflow_dispatch' && steps.run_matchup.outcome == 'success'
        env:
          HOME_TEAM: ${{ inputs.home }}
          AWAY_TEAM: ${{ inputs.away }}
          GAME_DATE: ${{ inputs.game_date }}
          TRIALS: ${{ inputs.trials }}
        run: |
          set -euo pipefail
          CONFIG=nba-game-config.json
          if [ ! -s "$CONFIG" ]; then echo "No matchup config was generated; skipping props."; exit 0; fi
          PLAYER_PROPS="$(jq -r '.player_props // true' "$CONFIG")"
          if [ "$PLAYER_PROPS" != "true" ]; then echo "Player props disabled by game_config_json."; exit 0; fi
          if [ -z "$GAME_DATE" ]; then GAME_DATE="$(TZ=America/New_York date +%F)"; fi
          PROP_TRIALS="$(jq -r '.prop_trials // 50000' "$CONFIG")"
          args=(--home "$HOME_TEAM" --away "$AWAY_TEAM" --date "$GAME_DATE" --season 2027 --trials "$PROP_TRIALS" --output nba-player-projections.json)
          if [ -s confirmed-lineups.json ]; then args+=(--lineups-json confirmed-lineups.json); fi
          if jq -e '.player_prop_lines_json != null' "$CONFIG" >/dev/null; then
            jq -c '.player_prop_lines_json' "$CONFIG" > player-prop-lines.json
            args+=(--lines-json player-prop-lines.json)
          fi
          python -m nba.player_props "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-matchup-results
          if-no-files-found: warn
          path: |
            nba-data-readiness.json
            nba-data-readiness.txt
            nba-simulation-results.txt
            nba-simulation-results.json
            nba-player-projections.json
