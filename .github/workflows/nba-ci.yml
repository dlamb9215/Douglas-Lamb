name: NBA Simulator CI
on:
  push:
    paths:
      - "nba/**"
      - ".github/workflows/run_nba_simulator.yml"
      - ".github/workflows/update_nba_stats.yml"
      - ".github/workflows/nba-ci.yml"
  pull_request:
    paths:
      - "nba/**"
      - ".github/workflows/run_nba_simulator.yml"
      - ".github/workflows/update_nba_stats.yml"
      - ".github/workflows/nba-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Run NBA unit and backtest tests
        run: python -m unittest -v nba.test_simulator nba.test_backtest nba.test_data_quality
      - name: Validate NBA data quality and freshness
        run: python -m nba.data_quality --data nba/team_stats.json --max-age-hours 72
      - name: CLI smoke test
        run: python -m nba.simulator --home BOS --away NYK --spread -3.5 --total 221.5 --trials 10000 --no-auto-refine
