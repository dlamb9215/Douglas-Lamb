name: NBA Simulator CI
on:
  push:
    paths:
      - "nba/**"
      - "betting_engine/**"
      - ".github/workflows/run_nba_simulator.yml"
      - ".github/workflows/update_nba_stats.yml"
      - ".github/workflows/settle-nba-ledger.yml"
      - ".github/workflows/nba-ci.yml"
  pull_request:
    paths:
      - "nba/**"
      - "betting_engine/**"
      - ".github/workflows/run_nba_simulator.yml"
      - ".github/workflows/update_nba_stats.yml"
      - ".github/workflows/nba-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-nba.txt PyYAML
      - name: Lint NBA simulator workflow expressions
        uses: rhysd/actionlint@v1.7.7
        with:
          args: .github/workflows/run_nba_simulator.yml .github/workflows/settle-nba-ledger.yml .github/workflows/nfl_validation.yml
      - name: Validate NBA workflow YAML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path(".github/workflows/run_nba_simulator.yml")
          workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert isinstance(workflow, dict) and isinstance(workflow.get("jobs"), dict), "NBA workflow must define jobs"
          assert "workflow_dispatch" in workflow.get(True, workflow.get("on", {})), "NBA workflow must retain workflow_dispatch"
          print("NBA workflow YAML structure: valid")
          PY
      - name: Run NBA unit and backtest tests
        run: python -m unittest -v nba.test_simulator nba.test_backtest nba.test_prediction_ledger nba.test_settle_ledger nba.test_data_quality nba.test_data_hub nba.test_schedule nba.test_odds nba.test_espn_odds nba.test_injuries nba.test_player_props nba.test_player_props_backtest betting_engine.test_decision betting_engine.test_integrations
      - name: Compile NBA simulator modules
        run: python -m compileall -q nba
      - name: Validate NBA data quality and freshness
        run: python -m nba.data_quality --data nba/team_stats.json --max-age-hours 72
      - name: CLI smoke test
        run: python -m nba.simulator --home BOS --away NYK --spread -3.5 --total 221.5 --trials 10000 --no-auto-refine
