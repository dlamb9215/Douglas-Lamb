name: Run Doug's Elite NHL Simulator

on:
  workflow_dispatch:
    inputs:
      home:
        description: Home NHL team abbreviation
        required: true
        default: BOS
        type: string
      away:
        description: Away NHL team abbreviation
        required: true
        default: FLA
        type: string
      trials:
        description: Monte Carlo trials
        required: true
        default: "100000"
        type: string
      total:
        description: Sportsbook total goals line
        required: true
        default: "6.0"
        type: string
      puck_line:
        description: Puck line magnitude (normally 1.5)
        required: true
        default: "1.5"
        type: string
      seed:
        description: Reproducible random seed
        required: true
        default: "42"
        type: string

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run NHL simulator tests
        run: python -m unittest -v nhl.test_simulator
      - name: Run 100,000-trial NHL matchup
        run: >-
          python -m nhl.simulator
          --home "${{ inputs.home }}"
          --away "${{ inputs.away }}"
          --trials "${{ inputs.trials }}"
          --total "${{ inputs.total }}"
          --puck-line "${{ inputs.puck_line }}"
          --seed "${{ inputs.seed }}"
          --output nhl-simulation-results.txt
      - name: Upload NHL simulation results
        uses: actions/upload-artifact@v4
        with:
          name: nhl-simulation-results
          path: nhl-simulation-results.txt
          if-no-files-found: error
